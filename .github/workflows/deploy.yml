name: Publicar frontend en GitHub Pages

on:
  push:
    branches:
      - aws
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repo
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # --base-href: GitHub Pages sirve el sitio de un repo bajo /<nombre-repo>/,
      # no en la raiz del dominio, asi que todas las rutas de assets del index.html
      # tienen que quedar prefijadas con eso.
      - name: Compilar (produccion, base-href de GitHub Pages)
        run: npm run build -- --configuration production --base-href "/${{ github.event.repository.name }}/"

      # GitHub Pages sirve un 404.html si lo hay; copiamos index.html como 404.html
      # para que cualquier ruta desconocida caiga en la app (con hash-routing esto
      # es solo un respaldo extra, la navegacion normal ya funciona con #/).
      - name: Preparar 404.html de respaldo
        run: cp dist/pc_builderfront/browser/index.html dist/pc_builderfront/browser/404.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pc_builderfront/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
